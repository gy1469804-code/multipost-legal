<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>授权中转 · MultiPost Studio</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#303133}
  .box{background:#fff;border-radius:12px;padding:28px 32px;max-width:580px;width:100%;
       box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h2{margin:0 0 6px;font-size:18px}
  .muted{color:#909399;font-size:13px;line-height:1.8}
  code{background:#f5f7fa;border:1px solid #e4e7ed;border-radius:4px;padding:2px 6px;
       font-size:12px;word-break:break-all}
  .ok{color:#67c23a;font-weight:600}
  .err{color:#f56c6c;font-weight:600}
  button{margin-top:14px;padding:9px 18px;border:0;border-radius:6px;background:#000;color:#fff;
         font-size:14px;cursor:pointer}
  button.ghost{background:#fff;color:#303133;border:1px solid #dcdfe6;margin-left:8px}
  input[type=text]{width:96px;padding:6px 8px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px}
  .row{margin-top:16px;padding-top:14px;border-top:1px solid #ebeef5}
</style>
</head>
<body>
<div class="box">
  <h2 id="title">正在把授权结果转回本地…</h2>
  <p class="muted" id="msg">如果 3 秒后没有自动跳转，点下面的按钮手动完成。</p>
  <p class="muted" id="detail" style="display:none"></p>
  <div>
    <button onclick="go()">手动转回本地</button>
    <button class="ghost" onclick="copyCode()">复制授权码</button>
  </div>
  <div class="row muted">
    本地工具地址：<code id="local">http://localhost:8000/oauth/callback</code><br />
    端口不对？改成你实际启动的端口：
    <input type="text" id="port" value="8000" />
    <button class="ghost" style="margin-top:6px" onclick="savePort()">保存并重跳</button>
    <br /><span style="font-size:12px">没启动本地工具的话会打不开，先去启动再点上面的按钮。</span>
  </div>
</div>
<script>
  var qs = new URLSearchParams(location.search);

  function getPort() {
    var p = qs.get('port');
    if (!p) { try { p = localStorage.getItem('mp_local_port'); } catch (e) {} }
    if (!p) p = '8000';
    return String(p).replace(/\D/g, '') || '8000';
  }
  var PORT = getPort();
  document.getElementById('port').value = PORT;

  function localUrl() {
    return 'http://localhost:' + PORT + '/oauth/callback';
  }
  function render() { document.getElementById('local').textContent = localUrl(); }

  function build() {
    var p = new URLSearchParams();
    var code = qs.get('code') || '';
    var state = qs.get('state') || '';
    var err = qs.get('error') || qs.get('error_string') || '';
    if (code) p.set('code', code);
    if (state) p.set('state', state);
    if (err) p.set('error', err);
    return localUrl() + '?' + p.toString();
  }

  function go() { location.href = build(); }

  function savePort() {
    PORT = document.getElementById('port').value.replace(/\D/g, '') || '8000';
    try { localStorage.setItem('mp_local_port', PORT); } catch (e) {}
    render();
    go();
  }

  function copyCode() {
    var code = qs.get('code') || '';
    if (!code) return;
    try { navigator.clipboard.writeText(code); alert('授权码已复制'); }
    catch (e) { prompt('手动复制授权码：', code); }
  }

  (function () {
    render();
    var t = document.getElementById('title');
    var m = document.getElementById('msg');
    var d = document.getElementById('detail');
    var err = qs.get('error') || qs.get('error_string') || '';
    var code = qs.get('code') || '';
    if (err) {
      t.textContent = '授权失败';
      t.className = 'err';
      m.textContent = 'TikTok 返回：' + err + '（' + (qs.get('errCode') || '-') + '）';
      return;
    }
    if (!code) {
      t.textContent = '没有拿到授权码';
      t.className = 'err';
      m.textContent = '这个页面需要带 code 参数访问。请从发布工具的「网页授权」按钮重新发起。';
      return;
    }
    d.style.display = 'block';
    d.innerHTML = '授权码前缀：<code>' + code.slice(0, 12) + '…</code>';
    setTimeout(go, 1200);
  })();
</script>
</body>
</html>
